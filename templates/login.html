<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Acess Internet Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #000;   /* Black background */
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header { padding: 1rem; }
    header img { height: 32px; }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .login-box {
      background: #fff;   /* White login card */
      padding: 2rem;
      border-radius: 10px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
      color: #333;
    }

    .login-box h2 {
      margin-bottom: 1rem;
      font-weight: 600;
      font-size: 1.4rem;
      color: #000;
    }

    .login-box input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      margin-top: 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      background: #f57c00;
      color: #fff;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #e56f00;
    }

    .error {
      color: #d9534f;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .logo img {
    width: 200px;   /* 🔥 adjust this size */
    height: auto;
    border-radius: 50px; /* optional: makes edges rounded */
  }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- ✅ Logo at top-left -->
  <div class="logo">
    <img src="{{ url_for('static', filename='images/bank-logo.png') }}" alt="Bank Logo">
  </div>

  <main>
    <div class="login-box">
      <h2>Access more Login</h2>

      <!-- ✅ LOGIN FORM -->
      <form method="POST" action="{{ url_for('login') }}">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn">LOGIN</button>
      </form>


      <!-- ✅ END FORM -->
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}
    </div>
  </main>
</body>
</html>
